# ============================================
# SkyCrew - Production Profile (PostgreSQL + AWS)
# ============================================

# ---- Database (AWS RDS / Docker PostgreSQL) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skycrew_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver

# ---- JPA ----
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- H2 Console (disabled in production) ----
spring.h2.console.enabled=false

# ---- JWT ----
skycrew.jwt.secret=${SKYCREW_JWT_SECRET}
skycrew.jwt.expiration-ms=${SKYCREW_JWT_EXPIRATION_MS:86400000}

# ---- Rate Limiting ----
skycrew.rate-limit.requests-per-minute=${SKYCREW_RATE_LIMIT_REQUESTS_PER_MINUTE:30}

# ---- Business Rules ----
skycrew.rules.min-rest-hours=${SKYCREW_RULES_MIN_REST_HOURS:12}
skycrew.rules.default-max-monthly-hours-cockpit=100
skycrew.rules.default-max-monthly-hours-cabin=120

# ---- Email / Notifications ----
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
skycrew.notifications.enabled=${SKYCREW_NOTIFICATIONS_ENABLED:false}
skycrew.notifications.from-email=${SKYCREW_NOTIFICATIONS_FROM:noreply@skycrew.com}

# ---- Actuator (health checks for Docker/AWS) ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
