# ============================================
# SkyCrew - Aviation Roster & Conflict Resolution API
# ============================================

# ---- Active Profile ----
spring.profiles.active=dev

# ---- Application ----
spring.application.name=skycrew
server.port=8080

# ---- Database (H2 for development) ----
spring.datasource.url=jdbc:h2:mem:skycrew_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Flyway Migrations ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- JWT Configuration ----
skycrew.jwt.secret=c2t5Y3Jldy1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtYXV0aGVudGljYXRpb24tMjAyNg==
skycrew.jwt.expiration-ms=86400000

# ---- Rate Limiting ----
skycrew.rate-limit.requests-per-minute=50

# ---- Business Rules ----
skycrew.rules.min-rest-hours=12
skycrew.rules.default-max-monthly-hours-cockpit=100
skycrew.rules.default-max-monthly-hours-cabin=120

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# ---- Notifications (disabled in dev — logs only) ----
skycrew.notifications.enabled=false
skycrew.notifications.from-email=noreply@skycrew.com

# ---- Email (not needed in dev, notifications are logged) ----
spring.mail.host=localhost
spring.mail.port=1025
