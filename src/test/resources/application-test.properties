# ============================================
# SkyCrew - Test Profile Configuration
# ============================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway in tests - use JPA auto DDL
spring.flyway.enabled=false

# Seed test data via data.sql AFTER Hibernate creates schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Short JWT expiry for testing
skycrew.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3Rpbmctb25seQ==
skycrew.jwt.expiration-ms=3600000

# Business Rules
skycrew.rules.min-rest-hours=12
skycrew.rules.default-max-monthly-hours-cockpit=100
skycrew.rules.default-max-monthly-hours-cabin=120

# Rate Limiting - higher limit for tests
skycrew.rate-limit.requests-per-minute=1000

# Notifications disabled in tests
skycrew.notifications.enabled=false
skycrew.notifications.from-email=test@skycrew.com

# Dummy mail config (notifications disabled anyway)
spring.mail.host=localhost
spring.mail.port=1025
